<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shorts Blocked — TubeSift</title>
  <link rel="stylesheet" href="blocked.css">
</head>
<body>
  <div class="blocked-container">
    <div class="blocked-card">
      <!-- Shield Icon -->
      <div class="shield-icon" aria-hidden="true">
        <svg width="72" height="72" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L3 7V12C3 17.55 6.84 22.74 12 24C17.16 22.74 21 17.55 21 12V7L12 2Z"
                fill="url(#shield-gradient)" opacity="0.15"/>
          <path d="M12 2L3 7V12C3 17.55 6.84 22.74 12 24C17.16 22.74 21 17.55 21 12V7L12 2Z"
                stroke="url(#shield-gradient)" stroke-width="1.5" fill="none"/>
          <line x1="9" y1="9" x2="15" y2="15" stroke="#ff4444" stroke-width="2" stroke-linecap="round"/>
          <line x1="15" y1="9" x2="9" y2="15" stroke="#ff4444" stroke-width="2" stroke-linecap="round"/>
          <defs>
            <linearGradient id="shield-gradient" x1="3" y1="2" x2="21" y2="24" gradientUnits="userSpaceOnUse">
              <stop stop-color="#ff4444"/>
              <stop offset="1" stop-color="#cc0000"/>
            </linearGradient>
          </defs>
        </svg>
      </div>

      <h1 class="blocked-title">Shorts Blocked</h1>
      <p class="blocked-message">
        YouTube Shorts have been blocked by <strong>TubeSift</strong>.
        This page cannot be viewed while Shorts blocking is active.
      </p>

      <div class="blocked-actions">
        <a href="https://www.youtube.com" class="btn btn-primary" id="btn-home">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
          Go to YouTube
        </a>
        <button class="btn btn-secondary" id="btn-back">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
          </svg>
          Go Back
        </button>
      </div>

      <p class="blocked-hint">
        To disable Shorts blocking, click the TubeSift icon in your browser toolbar.
      </p>
    </div>
  </div>

  <script>
    document.getElementById('btn-back').addEventListener('click', () => {
      if (history.length > 1) {
        history.back();
      } else {
        window.location.href = 'https://www.youtube.com';
      }
    });
  </script>
</body>
</html>
