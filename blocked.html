<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shorts blocked — TubeSift</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="blocked.css">
</head>
<body>

<main class="wrap">
  <div class="card">

    <div class="shield" aria-hidden="true">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L3 7v5c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5Z"
              fill="currentColor" opacity="0.12"/>
        <path d="M12 2L3 7v5c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5Z"
              stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
        <path d="M9.5 9.5l5 5m0-5l-5 5"
              stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>

    <h1>Shorts blocked</h1>
    <p class="message">
      TubeSift stopped this Short from loading. That was your call — you can
      change it any time.
    </p>

    <p class="stat hidden" id="stat-line"></p>

    <div class="actions">
      <a class="btn btn-primary" href="https://www.youtube.com">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Go to YouTube
      </a>

      <button class="btn btn-secondary" id="btn-back">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="19" y1="12" x2="5" y2="12"/>
          <polyline points="12 19 5 12 12 5"/>
        </svg>
        Go back
      </button>
    </div>

    <div class="escape">
      <button class="link-btn" id="btn-allow">Allow Shorts again</button>
      <span class="sep" aria-hidden="true">·</span>
      <button class="link-btn" id="btn-options">TubeSift settings</button>
    </div>

  </div>
</main>

<script src="common.js"></script>
<script src="blocked.js"></script>
</body>
</html>
